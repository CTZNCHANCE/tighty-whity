<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An evidence-based look at the Visionary Private Equity Group receivership record. Educational only; not legal advice.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>The Case of the Vanishing Valuation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Special+Elite&family=Archivo+Narrow:wght@500;600;700&display=swap">
<style>
/* Layout: a crime drama in one look. Night-dark rooms; evidence lives on bone-colored paper laid on top.
   Single deliberate dark world: money-old green, oxblood, tarnished gold. */
:root{
  color-scheme:dark;
  --night:#0b0d0c; --night-2:#111513; --green:#13241b; --green-2:#1b3025;
  --bone:#ebe3d0; --bone-dim:#a69e8c; --muted:var(--bone-dim); --rule:#2c3a31;
  --paper:#eee5cf; --paper-2:#e2d6ba; --ink:#191612; --ink-soft:#5a5240; --line:#c5b593;
  --gold:#c8a24a; --gold-dim:#8a6f2e; --blood:#7d1717; --blood-hi:#b02a22; --focus:#e6b84f;
  --s-court:#1f4c7a; --s-sworn:#573c84; --s-plaintiff:#8a3616; --s-defense:#1f5c4b; --s-receiver:#40601a;
  --s-reported:#665420; --s-unverified:#585b58; --s-fiction:#8a1640;
  --ok:#2c6a36; --bad:#9a2a1c; --warn:#d9a441;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-type:"Special Elite","Courier New",Courier,monospace;
  --f-ui:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --f-mono:"Special Elite","Courier New",Courier,monospace;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>");
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--bone);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background:radial-gradient(120% 80% at 50% 0%,var(--green-2) 0%,var(--green) 38%,var(--night) 100%) fixed,var(--night)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--grain);opacity:.07;mix-blend-mode:overlay;z-index:50}
a{color:inherit}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.ui{font-family:var(--f-ui);letter-spacing:.03em}
.mono{font-family:var(--f-type);font-size:.8rem}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Paper surfaces: anything you'd hand to a detective */
.folder,.dialog,.lane,.pts div,.chal,.assess section,.group,.person,.reveal,.src,.drawer,.screenplay,.notice,.door button,.tl-card,.sheet{
  --muted:var(--ink-soft); --rule:var(--line); color:var(--ink);
  background:var(--paper) var(--grain); background-blend-mode:multiply}

/* Chrome */
.top{background:#050605;border-bottom:1px solid var(--gold-dim)}
.top .wrap{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand b{font-family:var(--f-display);font-weight:400;font-style:italic;font-size:1.45rem;letter-spacing:.01em;color:var(--bone)}
.brand span{font-family:var(--f-ui);font-size:.72rem;text-transform:uppercase;letter-spacing:.2em;color:var(--gold)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font-family:var(--f-ui);font-size:.82rem;text-transform:uppercase;letter-spacing:.12em;border:1px solid var(--gold-dim);background:transparent;color:var(--bone);border-radius:0;padding:6px 12px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn[aria-pressed="true"]{background:var(--gold);color:#120f08;border-color:var(--gold)}
.modes{display:inline-flex;border:1px solid var(--gold-dim)}
.modes button{border:0;min-height:36px;padding:6px 12px;background:transparent;color:var(--bone);font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.12em;font-size:.82rem;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--bone);color:#120f08}
.score{font-family:var(--f-type);font-size:.85rem;color:var(--gold);border:1px dashed var(--gold-dim);padding:5px 9px}
.strip{background:#080a09;color:var(--bone-dim);font-family:var(--f-ui);font-size:.8rem;letter-spacing:.02em;border-bottom:1px solid var(--rule)}
.strip .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;padding-block:7px;align-items:center}
.strip b{color:var(--bone)}
.strip a{color:var(--bone);text-underline-offset:3px}
.strip .fbi{margin-left:auto}
.notice-bar{background:var(--blood);color:var(--bone);font-family:var(--f-ui)}
.notice-bar .wrap{padding-block:8px}

nav.tabs{border-bottom:1px solid var(--rule);background:rgba(5,6,5,.6)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{font-family:var(--f-ui);font-size:.82rem;text-transform:uppercase;letter-spacing:.16em;border:0;background:none;padding:14px 12px 11px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;color:var(--bone-dim)}
nav.tabs button:hover{color:var(--bone)}
nav.tabs button[aria-current="page"]{color:var(--gold);border-bottom-color:var(--gold)}

main{padding-block:26px 72px}
.lede{max-width:66ch}
.section-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:16px}
.section-head h2{font-size:clamp(1.7rem,4vw,2.4rem);font-style:italic}
.section-head > span{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.14em;font-size:.74rem;color:var(--gold)}
.kicker{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.24em;font-size:.7rem;color:var(--gold)}
.slug{font-family:var(--f-type);letter-spacing:.04em;font-size:.9rem;color:var(--bone)}
.aside{font-family:var(--f-type);font-size:.88rem;border-left:2px solid var(--blood-hi);padding:4px 12px;color:var(--bone-dim);margin:12px 0;max-width:68ch}
.aside b{font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;color:var(--bone)}
.folder .aside,.dialog .aside,.person .aside,.reveal .aside{color:var(--ink-soft)}
.folder .aside b,.dialog .aside b,.person .aside b,.reveal .aside b{color:var(--ink)}

/* Title sequence */
.titlecard{position:relative;background:#030403;border-block:22px solid #000;text-align:center;padding-block:clamp(40px,8vw,88px);overflow:hidden}
.titlecard::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 50%,rgba(200,162,74,.12),transparent 70%);pointer-events:none}
.credit{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.34em;font-size:.72rem;color:var(--gold);margin:0}
.title-xl{font-size:clamp(2.3rem,7.5vw,5.2rem);margin:18px 0;color:var(--bone);letter-spacing:.01em}
.title-xl em{display:block;font-style:italic;color:var(--gold)}
@media (prefers-reduced-motion:no-preference){
  .title-xl{animation:settle 2.4s cubic-bezier(.2,.7,.2,1) both}
  @keyframes settle{from{letter-spacing:.12em;filter:blur(1.5px)}to{letter-spacing:.01em;filter:none}}
}
.welcome{display:grid;gap:26px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;padding-block:30px}
@media (max-width:820px){.welcome{grid-template-columns:1fr}}
.notice{border:1px solid var(--line);padding:16px 18px;font-size:1.02rem;box-shadow:0 18px 40px -24px #000}
.notice strong{display:block;font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.2em;font-size:.7rem;margin-bottom:6px;color:var(--blood)}
.door{display:grid;gap:14px}
.door button{text-align:left;border:0;border-left:6px solid var(--s-court);padding:16px 18px;cursor:pointer;box-shadow:0 18px 40px -24px #000;display:flex;flex-direction:column;gap:4px}
.door button.fic{border-left-color:var(--blood)}
.door button:hover{outline:1px solid var(--gold)}
.door .reel{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.24em;font-size:.68rem;color:var(--ink-soft)}
.door b{font-family:var(--f-display);font-style:italic;font-weight:400;font-size:1.7rem;line-height:1.1}
.door .mode-name{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.14em;font-size:.76rem;color:var(--ink-soft)}
.truecard{font-family:var(--f-type);font-size:.95rem;color:var(--blood);margin-top:6px}
.door span:last-child{font-size:.94rem;color:var(--ink-soft)}
.check{display:flex;gap:8px;align-items:center;font-family:var(--f-ui);letter-spacing:.03em}

/* Screenplay */
.screenplay{max-width:720px;padding:22px clamp(16px,5vw,48px);font-family:var(--f-type);font-size:.95rem;line-height:1.55;box-shadow:0 24px 50px -28px #000;margin-bottom:28px}
.screenplay p{margin:0 0 12px}
.screenplay .sp-slug{text-transform:uppercase;font-weight:400;letter-spacing:.03em}
.screenplay .sp-trans{text-align:right;text-transform:uppercase}
.screenplay .sp-char{text-transform:uppercase;margin:16px 0 0 34%}
.screenplay .sp-paren{margin:0 0 0 28%;color:var(--ink-soft)}
.screenplay .sp-dia{margin:0 12% 12px 20%}
@media (max-width:520px){.screenplay .sp-char{margin-left:22%}.screenplay .sp-paren{margin-left:14%}.screenplay .sp-dia{margin:0 0 12px 8%}}

/* Rooms */
.rooms{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.room{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.25)),var(--night-2);color:var(--bone);border:1px solid var(--rule);border-top:2px solid var(--gold-dim);padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-height:170px}
.room:hover{border-color:var(--gold);border-top-color:var(--gold)}
.room h3{font-size:1.45rem;font-style:italic}
.room .meta{margin-top:auto;font-family:var(--f-ui);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--bone-dim);display:flex;gap:12px;flex-wrap:wrap}
.room > span:not(.kicker):not(.meta):not(.slug){color:var(--bone-dim);font-size:.94rem}
main.fic-band{background:linear-gradient(180deg,rgba(125,23,23,.12),rgba(125,23,23,0) 640px)}

.cards{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.folder{position:relative;border:0;padding:24px 16px 16px;text-align:left;cursor:pointer;box-shadow:0 16px 34px -22px #000;display:flex;flex-direction:column;gap:9px;min-width:0;transform:rotate(-.25deg)}
.folder:nth-child(2n){transform:rotate(.3deg)}
.folder::before{content:"";position:absolute;top:-9px;left:16px;width:92px;height:10px;background:var(--paper-2);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}
.folder:hover{outline:1px solid var(--gold);transform:none}
.folder h3{font-family:var(--f-body);font-weight:600;font-size:1.02rem;line-height:1.3}
.folder .cite{font-family:var(--f-type);font-size:.74rem;color:var(--ink-soft)}
.folder .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.stamp{position:absolute;top:10px;right:12px;font-family:var(--f-ui);font-weight:700;font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blood);border:2px solid var(--blood);padding:1px 6px;transform:rotate(4deg);opacity:.85}
.empty-slot{border:1px dashed var(--bone-dim);background:rgba(0,0,0,.25);padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.empty-slot h3{font-family:var(--f-ui);font-size:.9rem;font-weight:600;letter-spacing:.04em}
.empty-slot p{margin:0;font-size:.9rem;color:var(--bone-dim)}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--paper);border:1.5px solid currentColor;padding:2px 7px;white-space:nowrap}
.chip i{font-style:normal;font-weight:500;text-transform:none;letter-spacing:.02em}
.chip.fiction{background-image:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,currentColor 16%,transparent) 4px 6px)}
.tag{font-family:var(--f-ui);font-size:.72rem;letter-spacing:.06em;background:var(--paper-2);color:var(--ink);border:1px solid var(--line);padding:1px 7px}
.hidden-status{font-family:var(--f-type);font-size:.74rem;border:1.5px dashed var(--ink-soft);padding:2px 7px;color:var(--ink-soft)}

/* Dialog */
.scrim{position:fixed;inset:0;background:rgba(3,4,3,.78);display:flex;justify-content:center;align-items:flex-start;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;z-index:60}
.dialog{border-top:6px solid var(--gold-dim);width:min(780px,100%);padding:22px;box-shadow:0 30px 80px -20px #000;margin-block:12px;position:relative}
.dialog h2{font-size:1.65rem;margin:6px 0 10px}
.dialog .kicker{color:var(--gold-dim)}
.dialog .stamp ~ .kicker{padding-right:118px}
.fieldgrid{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;font-size:.92rem;margin:12px 0}
.fieldgrid dt{font-family:var(--f-ui);letter-spacing:.06em;text-transform:uppercase;font-size:.74rem;color:var(--ink-soft);padding-top:3px}
.fieldgrid dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.fieldgrid{grid-template-columns:1fr}.fieldgrid dd{margin-bottom:6px}}
blockquote{margin:12px 0;padding:10px 16px;border-left:3px solid var(--blood);background:var(--paper-2);font-style:italic}
.box{border:1px solid var(--line);padding:10px 12px;margin:10px 0;background:rgba(255,255,255,.35)}
.box h4{margin:0 0 4px;font-family:var(--f-ui);font-size:.72rem;text-transform:uppercase;letter-spacing:.18em;color:var(--ink-soft)}
.quiz,.opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.quiz button,.opts button{font-family:var(--f-ui);font-size:.86rem;letter-spacing:.02em;border:1px solid var(--line);background:var(--paper-2);color:var(--ink);padding:6px 10px;cursor:pointer}
.quiz button:hover,.opts button:hover{border-color:var(--ink)}
.opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.opts button:disabled{cursor:default}
.fb{font-family:var(--f-ui);font-size:.9rem;padding:6px 10px;border-left:4px solid}
.fb.ok{border-color:var(--ok)} .fb.no{border-color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.dlg-btn{font-family:var(--f-ui);font-size:.82rem;text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--gold-dim);background:var(--paper-2);color:var(--ink);padding:7px 12px;cursor:pointer;min-height:38px}
.dlg-btn:hover{border-color:var(--ink)}
.dlg-btn.primary{background:var(--blood);color:var(--bone);border-color:var(--blood)}
.dlg-btn:disabled{opacity:.5;cursor:not-allowed}
.tagpick{display:flex;flex-wrap:wrap;gap:6px}
.tagpick button{font-family:var(--f-ui);font-size:.8rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:3px 10px;cursor:pointer}
.tagpick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
textarea,input[type=text],select{width:100%;border:1px solid var(--line);background:#f8f2e2;color:var(--ink);padding:7px 9px}

/* Drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);border-left:3px double var(--gold-dim);z-index:70;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 18px 24px;box-shadow:-30px 0 60px -20px #000}
.drawer h2{font-size:1.5rem;font-style:italic}
.src{border:1px solid var(--line);padding:10px 12px;margin:10px 0}
.src.hl{outline:2px solid var(--blood)}
.src h3{font-family:var(--f-body);font-weight:600;font-size:.98rem}
.src a{overflow-wrap:anywhere}

/* Caseboard */
.lanes{display:grid;gap:14px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.lanes{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.lanes{grid-template-columns:1fr}}
.lane{padding:12px;min-width:0;box-shadow:0 16px 34px -22px #000;border-top:4px solid var(--ink)}
.lane h3{font-family:var(--f-ui);font-size:.8rem;text-transform:uppercase;letter-spacing:.14em;margin-bottom:2px}
.lane > p{font-size:.84rem;color:var(--ink-soft);margin:0 0 10px}
.lane.fic{border-top-color:var(--blood);background-image:var(--grain),repeating-linear-gradient(135deg,transparent 0 12px,rgba(125,23,23,.07) 12px 14px)}
.pin{background:#f8f2e2;border:1px solid var(--line);padding:8px 10px;margin-bottom:8px;font-size:.9rem;position:relative}
.pin::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--blood-hi);box-shadow:0 2px 2px rgba(0,0,0,.4)}
.pin button.linkish{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.pin ul{margin:6px 0 0;padding-left:18px}
.pts{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));margin:12px 0 22px}
.pts div{padding:9px 11px;border-top:3px solid var(--gold-dim)}
.pts b{font-family:var(--f-display);font-size:1.6rem;display:block;line-height:1.1}
.pts span{font-family:var(--f-ui);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

/* Timeline */
.tl{list-style:none;margin:0;padding:0;border-left:1px solid var(--gold-dim);margin-left:6px}
.tl li{position:relative;padding:0 0 18px 20px}
.tl li::before{content:"";position:absolute;left:-6px;top:7px;width:11px;height:11px;background:var(--night);border:2px solid var(--gold)}
.tl .when{font-family:var(--f-type);font-size:.82rem;color:var(--gold)}
.tl .conf{font-family:var(--f-ui);font-size:.82rem;letter-spacing:.03em;color:var(--warn);font-weight:600}
.tl .dlg-btn{min-height:28px;padding:1px 8px;font-size:.72rem}

/* People / cast */
.groups{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.group{padding:14px;min-width:0;box-shadow:0 16px 34px -22px #000}
.group h3{font-size:1.3rem;font-style:italic;margin-bottom:6px}
.ent{border-top:1px solid var(--line);padding:8px 0}
.ent b{font-weight:600}
.rel{font-size:.9rem;margin:3px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.rel .dlg-btn{min-height:26px;padding:0 7px;font-size:.7rem}
.cast{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.person{padding:16px;box-shadow:0 16px 34px -22px #000;position:relative;display:flex;flex-direction:column;gap:6px}
.crest{width:58px;height:58px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-style:italic;font-size:1.35rem;background:var(--paper-2);box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--ink)}
.person h3{font-size:1.4rem;font-style:italic}
.person .role{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--ink-soft)}
.person p{margin:0}

/* Challenges */
.chal{padding:18px;margin-bottom:20px;box-shadow:0 16px 34px -22px #000}
.chal h3{font-style:italic}
.chal .kicker{color:var(--blood)}
.item{border-top:1px solid var(--line);padding:12px 0}
.pair{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:stretch;margin:6px 0 8px}
.pair > div{background:#f8f2e2;border:1px solid var(--line);padding:8px 10px;min-width:0}
.pair .amt{font-family:var(--f-display);font-size:1.1rem;font-variant-numeric:tabular-nums;display:block}
.pair .vs{align-self:center;font-family:var(--f-display);font-style:italic;font-size:1.4rem;color:var(--blood)}
@media (max-width:620px){.pair{grid-template-columns:1fr}.pair .vs{justify-self:center}}

/* Assessment & tables */
.assess{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.assess section{padding:16px 18px;min-width:0;box-shadow:0 16px 34px -22px #000;border-top:4px solid var(--s-court)}

var KEY = "vanishing-valuation-v1";
function blank(){
  return { started:false, mode:"real", humor:true, lens:"facts", tab:"brief", room:null,
    real:{ guess:{}, sourced:{}, alt:{}, board:{}, ledger:{}, wit:{}, res:{}, inq:{} },
    fic:{ seen:{}, board:{}, culprit:"", mech:"", picks:[], alts:{}, submitted:false } };
}
function load(){
  try { var raw = localStorage.getItem(KEY); if(!raw) return blank();
    var s = JSON.parse(raw), b = blank();
    // Every visit opens on the poster; saved progress is kept.
    return Object.assign(b, s, { started:false, real:Object.assign(b.real, s.real||{}), fic:Object.assign(b.fic, s.fic||{}) });
  } catch(err){ return blank(); }
}
function save(s){ try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(err){} }

function realScore(r){
  var cls=0, src=0, unc=0, dbl=0, alt=0;
  CARDS.forEach(function(c){
    if (r.guess[c.id] === c.status) cls += 10;
    if (r.sourced[c.id]) src += 2;
    if (r.alt[c.id]) alt += 3;
    var b = r.board[c.id];
    if (b){
      if (b.tags.indexOf("Inconsistency")>=0 && c.conflicts) unc += 5;
      if (b.tags.indexOf("Missing record")>=0) unc += 2;
      unc += Math.min(2, b.questions.length) * 2;
    }
  });
  LEDGER_ITEMS.forEach(function(i){ if (r.ledger[i.id] === i.ans) dbl += 10; });
  WIT_ITEMS.forEach(function(i){ if (r.wit[i.id] === i.ans) cls += 10; });
  RES_ITEMS.forEach(function(i){ if (r.res[i.id] && i.ok.indexOf(r.res[i.id])>=0) unc += 10; });
  var inqPts=0, inq=r.inq||{};
  MYSTERIES.forEach(function(m){ ["facts","born"].forEach(function(l){ var a=inq[l+":"+m.id], o=l==="facts"?"born":"facts"; if(a===l) inqPts+=15; else if(a===o) inqPts+=5; }); });
  return { "Reading the record (The Inquiry)":inqPts, "Accurate sourcing":src, "Correct evidence classification":cls, "Identifying uncertainty":unc, "Avoiding double-counting":dbl, "Recognizing alternative explanations":alt };
}
function ficScore(f){
  var ex=0, ev=0, alt=0;
  F_CARDS.forEach(function(c){ if (f.seen[c.id]) ex += 3; });
  if (f.submitted){
    f.picks.forEach(function(id){ if (KEY_CLUES.indexOf(id)>=0) ev += 10; });
    ALTS.forEach(function(a){ if (f.alts[a.id] && a.ok.indexOf(f.alts[a.id])>=0) alt += 10; });
  }
  return { "Clues examined":ex, "Evidence cited":ev, "Alternatives ruled out":alt };
}
function sum(o){ return Object.keys(o).reduce(function(a,k){ return a+o[k]; },0); }

function Welcome(p){
  var st = p.st, up = p.up;
  function start(m){ up(function(n){ n.started = true; n.mode = m; n.tab = m === "real" ? "brief" : "rooms"; }); }
  return html`<main style=${{paddingTop:0}}>
    <section className="hero" aria-label="Title"><${Poster} /></section>
    <div className="wrap welcome">
      <div>
        <div className="notice" role="note">
          <strong>Before you begin</strong>
          An independent educational experience—not legal advice, an official investigation, or an accusation of criminal guilt. Allegations are not findings. The real case may remain unresolved.
        </div>
        <p className="lede">Some people playing this lost money in the fund described in Part One. Part One treats that seriously. It sorts the public record into what courts ordered, what witnesses said under oath, what parties allege, and what nobody knows yet. It never asks you to decide who is guilty, and its jokes are only about jargon.</p>
        <p className="lede muted">Part Two is a separate, invented whodunit about a posh family, an orchard trust and a missing orchard. None of its characters is based on a real person.</p>
        <label className="check"><input type="checkbox" id="humor-toggle" checked=${st.humor} onChange=${function(ev){ var v = ev.target.checked; up(function(n){ n.humor = v; }); }} /> Include dry humor</label>
      </div>
      <div className="door">
        <button onClick=${function(){ start("real"); }}>
          <span className="reel">Part One</span>
          <b>The Record</b>
          <span className="mode-name">Case Explorer</span>
          <span className="truecard">This is a real case. Nothing here decides it.</span>
          <span>Six rooms of sourced evidence and three challenges. It ends in an Evidence Assessment, not a verdict. Some evidence slots are left empty on purpose.</span>
        </button>
        <button className="fic" onClick=${function(){ start("fiction"); }}>
          <span className="reel">Part Two</span>
          <b>The Fiction</b>
          <span className="mode-name">Fictional Mystery</span>
          <span className="truecard">This is not a true story.</span>
          <span>Pellingham Manor. One missing orchard. Seven people who would all prefer it was somebody else. Invented from top to bottom, with a fair solution.</span>
        </button>
        <p className="ui muted" style=${{fontSize:".85rem",margin:0}}>Points reward sourcing, classification, spotting uncertainty, avoiding double-counting, and weighing alternatives. Accusations earn nothing.</p>
      </div>
    </div>
  </main>`;
}

function ColdOpen(){
  return html`<div className="screenplay" role="region" aria-label="Cold open (fiction)">
    ${COLD_OPEN.map(function(l, i){ return html`<p key=${i} className=${"sp-" + l[0]}>${l[1]}</p>`; })}

}

function Rooms(p){
  var st = p.st, real = st.mode === "real";
  var list = real ? CARDS : F_CARDS;
  return html`<section>
    ${!real && html`<${ColdOpen} />`}
    <div className="section-head"><h2>${real ? "The record, in six rooms" : "Six rooms of Pellingham Manor"}</h2>
      <span>${real ? "Each card cites its source · classify before the status is revealed" : "Every exhibit here is fictional game material"}</span></div>
    <div className="rooms">
      ${ROOMS.map(function(r, i){
        var cs = list.filter(function(c){ return c.room === r.id; });
        var done = cs.filter(function(c){ return real ? st.real.guess[c.id] : st.fic.seen[c.id]; }).length;
        var empty = real ? (EMPTY[r.id]||[]).length : 0;
        return html`<button key=${r.id} className="room" onClick=${function(){ p.up(function(n){ n.room = r.id; }); }}>
          <span className="kicker">${real ? "File " : "Scene "}${i+1}</span>
          <h3>${r.name}</h3>
          ${!real && html`<span className="slug">${r.slug}</span>`}
          <span>${real ? r.real : r.fic}</span>
          <span className="meta"><span>${cs.length} ${real ? "cards" : "exhibits"}</span><span>${done} ${real ? "classified" : "examined"}</span>${real && html`<span>${empty} empty slot${empty===1?"":"s"}</span>`}</span>
        </button>`;
      })}
    </div>
  </section>`;
}

function Room(p){
  var st = p.st, real = st.mode === "real";
  var idx = ROOMS.map(function(x){ return x.id; }).indexOf(p.id), r = ROOMS[idx];
  var list = (real ? CARDS : F_CARDS).filter(function(c){ return c.room === p.id; });
  var aside = st.humor ? (real ? REAL_ASIDES : FIC_ASIDES)[p.id] : null;
  return html`<section>
    <button className="dlg-btn" onClick=${function(){ p.up(function(n){ n.room = null; }); }}>← All rooms</button>
    <div style=${{margin:"18px 0 14px"}}>
      <div className="kicker">${real ? "File " : "Scene "}${idx+1}</div>
      <div className="section-head" style=${{margin:"4px 0 0"}}><h2>${r.name}</h2><span>${real ? r.real : r.fic}</span></div>
      ${!real && html`<div className="slug">${r.slug}</div>`}
    </div>
    ${aside && html`<p className="aside"><b>${real ? "Clerk’s aside (an invented interface joke, not about the real case):" : "Aside:"}</b> ${aside}</p>`}
    <div className="cards">
      ${list.map(function(c){
        var known = real ? st.real.guess[c.id] : true;
        var onBoard = real ? st.real.board[c.id] : st.fic.board[c.id];
        return html`<button key=${c.id} className="folder" onClick=${function(){ p.openCard(c.id); if (!real) p.up(function(n){ n.fic.seen[c.id] = true; }); }}>
          ${!real && html`<span className="stamp" aria-hidden="true">Exhibit</span>`}
          <h3>${c.head}</h3>
          <span className="cite">${real ? srcCite(c) : "Exhibit " + c.id.toUpperCase() + " · invented"}</span>
          <span className="row">
            ${known ? html`<${Chip} status=${real ? c.status : "fiction"} />` : html`<span className="hidden-status">Status: classify to reveal</span>`}
            ${onBoard && html`<span className="tag">On caseboard</span>`}
            ${!real && st.fic.seen[c.id] && html`<span className="tag">Examined</span>`}
          </span>
        </button>`;
      })}
      ${real && (EMPTY[p.id]||[]).map(function(s, i){
        return html`<div key=${"e"+i} className="empty-slot" role="group" aria-label="Empty evidence slot">
          <span><${Chip} status="unverified" /></span>
          <h3>Empty slot: ${s.t}</h3>
          <p>${s.b}</p>
        </div>`;
      })}
    </div>
  </section>`;
}

var TAGS = ["Inconsistency","Missing record","Timing gap","Disputed","Overlapping amounts"];
var Q_TEMPLATES = [
  "What record would confirm or refute this?",
  "What period does this figure cover?",
  "Who had firsthand knowledge?",
  "Does another source give a different number or date?",
  "What is the other side’s explanation?"
];

function useDialogFocus(){
  var ref = useRef(null);
  useEffect(function(){ var prev = document.activeElement; if (ref.current) ref.current.focus(); return function(){ if (prev && prev.focus) prev.focus(); }; }, []);
  return ref;
}

function CardDialog(p){
  var c = p.c, st = p.st, r = st.real, guessed = r.guess[c.id];
  var ref = useDialogFocus();
  var onBoard = r.board[c.id];
  var _q = useState(""), q = _q[0], setQ = _q[1];
  function guess(s){ p.up(function(n){ if (!n.real.guess[c.id]) n.real.guess[c.id] = s; }); }
  function toggleBoard(){ p.up(function(n){ if (n.real.board[c.id]) delete n.real.board[c.id]; else n.real.board[c.id] = { tags:[], questions:[] }; }); }
  function toggleTag(t){ p.up(function(n){ var b = n.real.board[c.id]; var i = b.tags.indexOf(t); if (i>=0) b.tags.splice(i,1); else b.tags.push(t); }); }
  function addQ(text){ text = (text||"").trim(); if (!text) return; p.up(function(n){ n.real.board[c.id].questions.push(text); }); setQ(""); }
  var titleId = "dlg-"+c.id;
  return html`<div className="scrim" onClick=${function(ev){ if (ev.target === ev.currentTarget) p.close(); }}>
    <div className="dialog" role="dialog" aria-modal="true" aria-labelledby=${titleId} tabIndex="-1" ref=${ref}>
      <div className="kicker">Evidence card · ${ROOMS.filter(function(x){return x.id===c.room;})[0].name}</div>
      <h2 id=${titleId}>${c.head}</h2>
      <dl className="fieldgrid">
        <dt>Document</dt><dd>${SOURCES[c.src].title}</dd>
        <dt>Document date</dt><dd>${c.date}</dd>
        <dt>Pinpoint</dt><dd className="mono">${c.pin}</dd>
        <dt>Source URL</dt><dd><a href=${SOURCES[c.src].url} target="_blank" rel="noopener noreferrer" className="mono">${SOURCES[c.src].url}</a></dd>
        <dt>Wording</dt><dd>${c.wording === "exact" ? "Exact quotation from the source" : "Paraphrase (short phrases in quotation marks are exact)"}</dd>
      </dl>
      <p><b>Relevant claim.</b> ${c.claim}</p>
      ${c.quotes.map(function(qq, i){ return html`<blockquote key=${i}>${qq}</blockquote>`; })}

      <div className="box">
        <h4>Evidence status</h4>
        ${!guessed ? html`<div>
            <p style=${{margin:"0 0 4px"}}>Classify this card before the status is revealed. You get one try.</p>
            <div className="quiz" role="group" aria-label="Choose a status">
              ${STATUS_ORDER.map(function(s){ return html`<button key=${s} onClick=${function(){ guess(s); }}>${STATUS[s].label}</button>`; })}
            </div></div>`
          : html`<div>
            <p style=${{margin:"0 0 6px"}}><${Chip} status=${c.status} /></p>
            <p className=${"fb " + (guessed === c.status ? "ok" : "no")}>${guessed === c.status ? "Correct (+10)." : "You chose “" + STATUS[guessed].label + ".” The status is “" + STATUS[c.status].label + ".”"} ${c.why}</p>
            <p className="muted" style=${{margin:"6px 0 0",fontSize:".92rem"}}><b>What this establishes:</b> ${STATUS[c.status].est}</p>
          </div>`}
      </div>

      <div className="box">
        <h4>Limitation or competing explanation</h4>
        ${r.alt[c.id] ? html`<p style=${{margin:0}}>${c.limit}</p>`
          : html`<button className="dlg-btn" onClick=${function(){ p.up(function(n){ n.real.alt[c.id] = true; }); }}>What else could explain this, or what limits it? (+3)</button>`}
      </div>

      <div className="actions">
        <button className="dlg-btn" onClick=${p.openSrc}>Open in source drawer${r.sourced[c.id] ? "" : " (+2)"}</button>
        <button className="dlg-btn primary" onClick=${toggleBoard}>${onBoard ? "Remove from caseboard" : "Add to caseboard"}</button>
        <button className="dlg-btn" onClick=${p.close}>Close</button>
      </div>

      ${onBoard && html`<div className="box">
        <h4>Tag it</h4>
        <div className="tagpick">${TAGS.map(function(t){ return html`<button key=${t} aria-pressed=${onBoard.tags.indexOf(t)>=0} onClick=${function(){ toggleTag(t); }}>${t}</button>`; })}</div>
        <p className="muted ui" style=${{fontSize:".8rem",margin:"6px 0 0"}}>“Inconsistency” scores only when another reviewed source really does conflict with this card.</p>
        <h4 style=${{marginTop:"12px"}}>Attach a question an investigator could ask next</h4>
        <div className="tagpick" style=${{marginBottom:"6px"}}>${Q_TEMPLATES.map(function(t){ return html`<button key=${t} onClick=${function(){ addQ(t); }}>${t}</button>`; })}</div>
        <label className="sr" htmlFor=${"q-"+c.id}>Your question</label>
        <div style=${{display:"flex",gap:"6px"}}>
          <input type="text" id=${"q-"+c.id} value=${q} placeholder="Or write your own question" onInput=${function(ev){ setQ(ev.target.value); }} onKeyDown=${function(ev){ if (ev.key==="Enter") addQ(q); }} />
          <button className="dlg-btn" onClick=${function(){ addQ(q); }}>Attach</button>
        </div>
        ${onBoard.questions.length > 0 && html`<ul>${onBoard.questions.map(function(x,i){ return html`<li key=${i}>${x}</li>`; })}</ul>`}
      </div>`}
    </div>
  </div>`;
}

function FicDialog(p){
  var c = p.c, st = p.st, ref = useDialogFocus(), onBoard = st.fic.board[c.id];
  var titleId = "fdlg-"+c.id;
  var r = ROOMS.filter(function(x){ return x.id===c.room; })[0];
  return html`<div className="scrim" onClick=${function(ev){ if (ev.target === ev.currentTarget) p.close(); }}>
    <div className="dialog" role="dialog" aria-modal="true" aria-labelledby=${titleId} tabIndex="-1" ref=${ref} style=${{borderTopColor:"var(--blood)"}}>
      <span className="stamp" aria-hidden="true">Exhibit ${c.id.toUpperCase()}</span>
      <div className="kicker">${r.name} · <span className="mono">${r.slug}</span></div>
      <h2 id=${titleId}>${c.head}</h2>
      <p><${Chip} status="fiction" /></p>
      <p style=${{fontFamily:"var(--f-type)",fontSize:".98rem"}}>${c.claim}</p>
      ${st.humor && c.joke && html`<p className="aside">${c.joke}</p>`}
      <div className="box"><h4>Auditor’s note</h4><p style=${{margin:0}}>${c.note}</p></div>
      <div className="actions">
        <button className="dlg-btn primary" onClick=${function(){ p.up(function(n){ if (n.fic.board[c.id]) delete n.fic.board[c.id]; else n.fic.board[c.id] = true; }); }}>${onBoard ? "Remove from caseboard" : "Add to caseboard"}</button>
        <button className="dlg-btn" onClick=${p.close}>Close</button>
      </div>
    </div>
  </div>`;
}

function Drawer(p){
  var ref = useDialogFocus(), d = p.d;
  return html`<aside className="drawer" role="dialog" aria-modal="true" aria-label="Source drawer" tabIndex="-1" ref=${ref}>
    <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",gap:"10px"}}>
      <h2>Source drawer</h2><button className="dlg-btn" onClick=${p.close}>Close</button>
    </div>
    ${d.card && html`<div className="box"><h4>Basis for this card</h4>
      <p style=${{margin:0}}><b>${d.card.head}</b><br/><span className="mono">${SOURCES[d.card.src].short} · ${d.card.pin}</span><br/>${d.card.wording === "exact" ? "Exact quotation." : "Paraphrase."}</p></div>`}
    <p className="muted" style=${{fontSize:".9rem"}}>Every factual statement in the Case Explorer rests on one of these four documents. Nothing else, including earlier research notes, is treated as a source.</p>
    ${["S88","S264","SJLP","SSLM"].map(function(k){ var s = SOURCES[k];
      var n = CARDS.filter(function(c){ return c.src === k; }).length;
      return html`<div key=${k} className=${"src" + (d.src === k ? " hl" : "")}>
        <h3>${s.title}</h3>
        <p className="mono" style=${{margin:"4px 0"}}>${s.date} · ${s.kind}</p>
        <p style=${{margin:"4px 0",fontSize:".9rem"}}>${s.note}</p>
        <p style=${{margin:"4px 0",fontSize:".85rem"}} className="muted">Review: ${s.status} Used by ${n} card${n===1?"":"s"}.</p>
        <a href=${s.url} target="_blank" rel="noopener noreferrer" className="mono">${s.url}</a>
      </div>`; })}
    <h3 style=${{marginTop:"18px",fontFamily:"var(--f-ui)",fontSize:".9rem",textTransform:"uppercase",letterSpacing:".08em"}}>Not retrieved (no card relies on these)</h3>
    <ul style=${{paddingLeft:"18px",fontSize:".9rem"}}>${NEEDED.map(function(x,i){ return html`<li key=${i}>${x.t}<br/><${NeedLinks} i=${i} /></li>`; })}</ul>
  </aside>`;
}

function Board(p){
  var st = p.st, real = st.mode === "real";
  if (!real){
    var ids = Object.keys(st.fic.board);
    return html`<section>
      <div className="section-head"><h2>Caseboard</h2><span className="muted ui">Fictional Mystery</span></div>
      <div className="lanes">
        <div className="lane"><h3>What the source establishes</h3><p>Real-case lane. Switch to the Case Explorer to use it.</p></div>
        <div className="lane"><h3>What a party alleges</h3><p>Real-case lane. Switch to the Case Explorer to use it.</p></div>
        <div className="lane"><h3>What an investigator asks next</h3><p>Real-case lane. Switch to the Case Explorer to use it.</p></div>
        <div className="lane fic"><h3>Exists only in the fictional story</h3><p>Exhibits you pinned at Pellingham Manor.</p>
          ${ids.length === 0 && html`<p className="muted">Nothing pinned yet.</p>`}
          ${ids.map(function(id){ var c = F_CARDS.filter(function(x){ return x.id === id; })[0];
            return html`<div key=${id} className="pin"><button className="linkish" onClick=${function(){ p.openCard(id); }}>${c.head}</button><div><${Chip} status="fiction" /></div></div>`; })}
        </div>
      </div>
    </section>`;
  }
  var ids2 = Object.keys(st.real.board);
  var cards = ids2.map(function(id){ return CARDS.filter(function(c){ return c.id === id; })[0]; });
  var established = cards.filter(function(c){ return c.status === "court" || c.status === "sworn" || c.status === "receiver"; });
  var alleged = cards.filter(function(c){ return ["plaintiff","defense","reported","unverified"].indexOf(c.status) >= 0; });
  function pin(c){
    var b = st.real.board[c.id];
    return html`<div key=${c.id} className="pin">
      <button className="linkish" onClick=${function(){ p.openCard(c.id); }}>${c.head}</button>
      <div style=${{margin:"4px 0"}}>${st.real.guess[c.id] ? html`<${Chip} status=${c.status} />` : html`<span className="hidden-status">Unclassified</span>`}</div>
      <div className="mono">${srcCite(c)}</div>
      ${b.tags.length > 0 && html`<div style=${{display:"flex",gap:"4px",flexWrap:"wrap",marginTop:"4px"}}>${b.tags.map(function(t){ return html`<span key=${t} className="tag">${t}</span>`; })}</div>`}
    </div>`;
  }
  var qs = [];
  cards.forEach(function(c){ st.real.board[c.id].questions.forEach(function(q, i){ qs.push({ c:c, q:q, i:i }); }); });
  return html`<section>
    <div className="section-head"><h2>Caseboard</h2><span className="muted ui">Four lanes, kept separate on purpose</span></div>
    <div className="pts">${Object.keys(p.score).map(function(k){ return html`<div key=${k}><b>${p.score[k]}</b><span>${k}</span></div>`; })}</div>
    ${cards.length === 0 && html`<p className="lede muted">Open a card in any room and choose “Add to caseboard.” Cards sort themselves into lanes by evidence status, so classify them first.</p>`}
    <div className="lanes">
      <div className="lane"><h3>What the source establishes</h3><p>Court orders, and the fact that sworn testimony was given. These show that something was ordered or said, not that every statement is true.</p>${established.map(pin)}</div>
      <div className="lane"><h3>What a party alleges</h3><p>Plaintiff allegations, defense positions and press reports. These are contested until tested.</p>${alleged.map(pin)}</div>
      <div className="lane"><h3>What an investigator asks next</h3><p>Questions you attached. They are open lines of inquiry, not conclusions.</p>
        ${qs.length === 0 && html`<p className="muted">No questions attached yet.</p>`}
        ${qs.map(function(x){ return html`<div key=${x.c.id+x.i} className="pin">${x.q}<div className="mono" style=${{marginTop:"4px"}}>re: ${x.c.head}</div>
          <button className="dlg-btn" style=${{marginTop:"6px",minHeight:"30px",padding:"2px 8px",fontSize:".8rem"}} onClick=${function(){ p.up(function(n){ n.real.board[x.c.id].questions.splice(x.i,1); }); }}>Remove question</button></div>`; })}
      </div>
      <div className="lane fic"><h3>Exists only in the fictional story</h3><p>This lane stays empty in the Case Explorer. Fiction never mixes with the record.</p></div>
    </div>
  </section>`;
}

function Timeline(p){
  if (!p.real) return html`<section>
    <div className="section-head"><h2>Timeline</h2><span>Fictional Mystery · every date is invented</span></div>
    <p className="aside">Pieced together from exhibits you can find in the manor rooms.</p>
    <ol className="tl">${F_TIMELINE.map(function(t,i){ return html`<li key=${i}><div className="when">${t.d}</div><div>${t.t}</div><div><${Chip} status="fiction" /></div></li>`; })}</ol>
  </section>`;
  return html`<section>
    <div className="section-head"><h2>Timeline</h2><span className="muted ui">Each entry carries the status of its source</span></div>

function Deduce(p){

  var ready = f.culprit && f.mech && f.picks.length >= 3;
  if (f.submitted) return html`<${Reveal} st=${p.st} up=${p.up} />`;
  return html`<section>
    <div className="section-head"><h2>The drawing room</h2><span className="muted ui">Fiction only. Points come from the evidence you cite, not from the name you choose.</span></div>
    ${seen.length < 8 && html`<p className="aside">You have examined ${seen.length} of ${F_CARDS.length} exhibits. You can submit at any time, but the fair solution needs clues from several rooms.</p>`}
    <div className="chal">
      <h3 style=${{fontSize:"1.3rem"}}>1. Who gave Southfield away and kept it on the books?</h3>
      <div className="opts" role="radiogroup" aria-label="Suspect">${CAST.map(function(c){ return html`<button key=${c.id} role="radio" aria-checked=${f.culprit===c.id} aria-pressed=${f.culprit===c.id} onClick=${function(){ upF(function(x){ x.culprit = c.id; }); }}>${c.n}</button>`; })}</div>
      <h3 style=${{fontSize:"1.3rem",marginTop:"16px"}}>2. How was it done?</h3>
      <div className="opts" role="radiogroup" aria-label="Mechanism">${MECHS.map(function(m){ return html`<button key=${m.id} role="radio" aria-checked=${f.mech===m.id} aria-pressed=${f.mech===m.id} onClick=${function(){ upF(function(x){ x.mech = m.id; }); }}>${m.t}</button>`; })}</div>
      <h3 style=${{fontSize:"1.3rem",marginTop:"16px"}}>3. Cite your evidence (pick 3 to 5 examined exhibits)</h3>
      ${seen.length === 0 ? html`<p className="muted">Examine exhibits in the manor rooms first.</p>` :
        html`<div className="opts">${seen.map(function(c){ var on = f.picks.indexOf(c.id) >= 0;
          return html`<button key=${c.id} aria-pressed=${on} disabled=${!on && f.picks.length >= 5} onClick=${function(){ upF(function(x){ var i = x.picks.indexOf(c.id); if (i>=0) x.picks.splice(i,1); else if (x.picks.length < 5) x.picks.push(c.id); }); }}>${c.id.toUpperCase()}: ${c.head}</button>`; })}</div>`}
      <h3 style=${{fontSize:"1.3rem",marginTop:"16px"}}>4. Rule out the competing explanations</h3>
      <p className="muted" style=${{marginTop:0}}>For each theory, choose the exhibit that does the most to defeat it.</p>
      ${ALTS.map(function(a){ return html`<div key=${a.id} style=${{margin:"8px 0"}}>
        <label htmlFor=${"alt-"+a.id}><b>${a.t}</b></label>

      <div className="actions"><button className="dlg-btn primary" disabled=${!ready} onClick=${function(){ upF(function(x){ x.submitted = true; }); }}>Present the case in the drawing room</button>

  </section>`;
}

        <h3>Not happened yet</h3>
        <p className="muted" style=${{marginTop:0}}>In the documents reviewed through ${REVIEW_DATE}:</p>
        <ul className="notyet">${NOT_YET.map(function(t, i){ return html`<li key=${i}>${t}</li>`; })}</ul>
        ${lens === "born" && html`<p className="aside">Civil cases move at the speed of motions. Bring a sandwich.</p>`}
        <div className="actions">
          <button className="dlg-btn primary" onClick=${function(){ p.go("files"); }}>Open the case files</button>
          <button className="dlg-btn" onClick=${function(){ p.go("inquiry"); }}>Play The Inquiry</button>
        </div>
      </div>
    </div>

    <div className="section-head" style=${{marginTop:"34px"}}><h2>Common-sense takeaways</h2><span>I was born on a day, not yesterday</span></div>
    <p className="lede muted">Lessons any investor can use, each drawn from a documented fact in this case. The lesson is ours; the fact is the record’s.</p>
    <div className="takeaways">${TAKEAWAYS.map(function(t, i){ return html`<div key=${i} className="sheet takeaway">
      <span className="tk-no">${i+1}</span>
      <h3>${t.t}</h3>
      <p>${t.f}</p>
      ${lens === "born" && html`<p className="aside">${t.b}</p>`}
      <span className="rowmeta"><${Chip} status=${t.s} /><span className="mono">${t.c}</span></span>
    </div>`; })}</div>
  </section>`;
}

var KIND_LABEL = { control:"Control", payments:"Payments", statements:"Statements", cash:"Cash", court:"Court" };

function CaseFiles(p){
  var _f = useState("zamber"), sel = _f[0], setSel = _f[1];
  var lens = p.st.lens, f = FILES.filter(function(x){ return x.id === sel; })[0];
  function list(title, rows){ return rows.length ? html`<div className="dsec"><h4>${title}</h4><ul className="rows">${rows.map(function(r, i){ return html`<${SrcRow} key=${i} r=${r} openSrc=${p.openSrc} />`; })}</ul></div>` : null; }
  return html`<section>
    <div className="section-head"><h2>Case files</h2><span>Key people · documented roles · our read, when you ask for it</span></div>
    <${LensNote} lens=${lens} />
    <div className="filepick" role="tablist" aria-label="Case files">
      ${FILES.map(function(x){ return html`<button key=${x.id} role="tab" aria-selected=${x.id === sel} onClick=${function(){ setSel(x.id); }}>
        <span className="mono">${x.no}</span> ${x.name}</button>`; })}
    </div>
    <article className="dossier sheet" aria-labelledby=${"df-"+f.id}>
      <header className="dhead">
        <div className="dstamp" aria-hidden="true">Case file ${f.no}</div>
        <div className="kicker" style=${{color:"var(--blood)"}}>${f.role}</div>
        <h3 id=${"df-"+f.id}>${f.name}</h3>
        <p className="dlede">${f.lede}</p>
      </header>
      <div className="dgrid">
        <div>
          ${list("Documented roles", f.roles)}
          ${list("Money (each figure is its own period and source; do not add them)", f.money)}
        </div>
        <div>
          ${list("On the record", f.record)}
          ${list("The other side, and limits", f.defense)}
        </div>
      </div>

      ${f.knew.length > 0 && html`<div className="dsec">
        <h4>What did he know, and when?</h4>
        <p className="muted" style=${{marginTop:0,fontSize:".9rem"}}>Dates when information existed in the record: things he received, signed, said or was sent. The documents show the information existed. Whether he absorbed it is an inference${lens === "born" ? ", and ours is below." : "."}</p>
        <ol className="kt">${f.knew.map(function(k, i){ return html`<li key=${i}>
          <span className="kt-when">${k[0]}</span>
          <span className="kt-kind">${KIND_LABEL[k[5]]}</span>
          <span className="kt-text">${k[1]}</span>
          <span className="rowmeta"><${Chip} status=${k[2]} /><button className="citebtn" onClick=${function(){ p.openSrc(k[3]); }}>${SOURCES[k[3]].short} · ${k[4]}</button></span>
        </li>`; })}</ol>
      </div>`}

      ${lens === "facts"
        ? html`<div className="dsec verdict facts"><h4>What the record establishes</h4><p>${f.facts}</p>
            <p className="muted" style=${{fontSize:".88rem",margin:0}}>Switch the lens to “I was born on a day, not yesterday” for our read.</p></div>`
        : html`<div className="dsec verdict born"><h4>Our read <span className="optag">Opinion · not a finding</span></h4>
            ${f.read.map(function(r, i){ return html`<div key=${i} className="read">
              <div className="read-q"><b>${r.q}</b><span className="conf">${r.conf}</span></div>
              <p>${r.a}</p></div>`; })}
            ${f.change && html`<p className="change"><b>What would change our mind:</b> ${f.change}</p>`}
          </div>`}
    </article>
  </section>`;
}

function Inquiry(p){
  var st = p.st, lens = st.lens, inq = st.real.inq || {};
  var other = lens === "facts" ? "born" : "facts";
  var solved = MYSTERIES.filter(function(m){ return inq[lens+":"+m.id]; }).length;
  var pts = 0; MYSTERIES.forEach(function(m){ var a = inq[lens+":"+m.id]; if (a === lens) pts += 15; else if (a === other) pts += 5; });
  function answer(m, id){ p.up(function(n){ n.real.inq = n.real.inq || {}; if (!n.real.inq[lens+":"+m.id]) n.real.inq[lens+":"+m.id] = id; }); }
  function feedback(m, a){
    var lead, cls;
    if (a === lens){ lead = "Correct (+15). "; cls = "ok"; }
    else if (a === other){ lead = lens === "born" ? "True, and safe (+5). But you were born on a day: " : "Probably right (+5). Also an opinion, and you said you’d stick to the facts. "; cls = "ok"; }
    else if (a === "naive"){ lead = "Born yesterday. "; cls = "no"; }
    else { lead = "Easy, counselor. "; cls = "no"; }
    var why = a === other ? m.fb[lens] : m.fb[a];
    return html`<p className=${"fb " + cls}>${lead}${why}</p>`;
  }
  return html`<section>
    <div className="section-head"><h2>The Inquiry</h2><span>Eight puzzles from the real record · solve them with the real exhibits</span></div>
    <${LensNote} lens=${lens} />
    <div className="sheet inq-rules">
      <p style=${{margin:0}}><b>How it works.</b> Open the exhibits, then choose a reading. In “Stick to the facts,” the right answer is what the record establishes. In “Born on a day,” it’s the most likely reading of that record. Believing the spin scores nothing in either lens. So does claiming more than the record supports. Switch lenses to play again.</p>
      <p className="mono" style=${{margin:"8px 0 0"}}>${LENSES[lens].short} lens: ${solved} of ${MYSTERIES.length} answered · ${pts} points</p>
    </div>
    ${MYSTERIES.map(function(m, i){ var a = inq[lens+":"+m.id];
      return html`<div key=${m.id} className="sheet mystery">
        <div className="kicker" style=${{color:"var(--blood)"}}>Puzzle ${i+1}</div>
        <h3>${m.title}</h3>
        <p className="mq">${m.q}</p>
        <div className="exh"><span className="mono">Exhibits:</span>
          ${m.ex.map(function(id){ var c = CARDS.filter(function(x){ return x.id === id; })[0];
            return html`<button key=${id} className="citebtn" onClick=${function(){ p.openCard(id); }}>${c.head}</button>`; })}</div>
        <div className="opts inq-opts" role="group" aria-label=${"Answers for " + m.title}>
          ${m.opts.map(function(o){ return html`<button key=${o[0]} aria-pressed=${a === o[0]} disabled=${!!a} onClick=${function(){ answer(m, o[0]); }}>${o[1]}</button>`; })}
        </div>
        ${a && feedback(m, a)}
      </div>`; })}
    <div className="actions">
      <button className="dlg-btn" onClick=${function(){ p.up(function(n){ n.lens = other; }); window.scrollTo(0,0); }}>Play again in the “${LENSES[other].name}” lens</button>
    </div>
  </section>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
})();
</script>

</body>
</html>
