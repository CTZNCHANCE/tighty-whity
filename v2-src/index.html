<style>
/* Layout: one long case dossier. Night-green desk; every section is a sheet of bone paper on it.
   Single deliberate dark world, same family as V1, with the fiction removed. */
:root{
  color-scheme:dark;
  --night:#0b0d0c; --night-2:#111513; --green:#13241b; --green-2:#1b3025;
  --bone:#ebe3d0; --bone-dim:#a69e8c; --muted:var(--bone-dim); --rule:#2c3a31;
  --paper:#eee5cf; --paper-2:#e2d6ba; --ink:#191612; --ink-soft:#5a5240; --line:#c5b593;
  --gold:#c8a24a; --gold-dim:#8a6f2e; --blood:#7d1717; --blood-hi:#b02a22; --focus:#e6b84f;
  --s-court:#1f4c7a; --s-sworn:#573c84; --s-plaintiff:#8a3616; --s-defense:#1f5c4b;
  --s-reported:#665420; --s-unverified:#585b58; --s-opinion:#7d1717;
  --c-insider:#a8351f; --c-lp:#2f6fa8; --c-odds:#7d1717;
  --f-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --f-body:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-type:"Special Elite","Courier New",Courier,monospace;
  --f-ui:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.6'/></svg>");
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;color:var(--bone);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background:radial-gradient(120% 70% at 50% 0%,var(--green-2) 0%,var(--green) 40%,var(--night) 100%) fixed,var(--night)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background-image:var(--grain);opacity:.07;mix-blend-mode:overlay;z-index:50}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-type);font-size:.8rem}
.kicker{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.24em;font-size:.7rem;color:var(--gold)}
.sheet{--muted:var(--ink-soft);--rule:var(--line);color:var(--ink);background:var(--paper) var(--grain);background-blend-mode:multiply;box-shadow:0 18px 40px -24px #000}

/* top strip + sticky nav */
.strip{background:#050605;color:var(--bone-dim);font-family:var(--f-ui);font-size:.8rem;border-bottom:1px solid var(--rule)}
.strip .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;padding-block:7px;align-items:center}
.strip b{color:var(--bone)} .strip a{color:var(--bone)}
.strip .fbi{margin-left:auto}
nav.toc{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(5,6,5,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
nav.toc .wrap{display:flex;gap:2px;overflow-x:auto;align-items:center}
nav.toc .brand{font-family:var(--f-display);font-style:italic;color:var(--bone);white-space:nowrap;padding-right:12px;text-decoration:none}
nav.toc a.sec{font-family:var(--f-ui);font-size:.76rem;text-transform:uppercase;letter-spacing:.14em;color:var(--bone-dim);text-decoration:none;padding:13px 10px 11px;border-bottom:2px solid transparent;white-space:nowrap}
nav.toc a.sec:hover{color:var(--gold);border-bottom-color:var(--gold)}

/* hero: the case folder */
.hero{padding-block:34px 10px}
.folder{position:relative;padding:34px clamp(18px,4vw,44px) 28px;border-top:6px solid var(--ink)}
.folder::before{content:"Case No. 4:25-cv-00132 · E.D. Mo.";position:absolute;top:-34px;left:22px;font-family:var(--f-type);font-size:.78rem;color:var(--ink);background:var(--paper-2);padding:7px 14px 5px;clip-path:polygon(6% 0,94% 0,100% 100%,0 100%)}
.stamp{position:absolute;top:22px;right:22px;font-family:var(--f-ui);font-weight:700;letter-spacing:.2em;text-transform:uppercase;font-size:.78rem;color:var(--blood);border:3px solid var(--blood);padding:3px 10px;transform:rotate(5deg);opacity:.85}
@media (max-width:560px){.stamp{position:static;display:inline-block;margin-bottom:10px}}
.hero h1{font-size:clamp(2.4rem,7.5vw,4.8rem);font-style:italic;letter-spacing:.005em}
.hero h1 span{display:block;font-style:normal;font-size:.42em;letter-spacing:.06em;margin-bottom:.1em}
.hero .sub{font-family:var(--f-type);font-size:1rem;margin:10px 0 22px;max-width:60ch}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tile{border-top:3px solid var(--ink);padding:10px 4px 4px}
.tile b{display:block;font-family:var(--f-display);font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:.86rem;margin-top:4px}
.tile small{display:block;font-family:var(--f-type);font-size:.7rem;color:var(--ink-soft);margin-top:4px}
.notice{margin-top:22px;border:1px solid var(--line);padding:12px 14px;font-size:.95rem;background:rgba(255,255,255,.35)}
.notice strong{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.18em;font-size:.68rem;color:var(--blood);display:block}

/* sections */
section.block{padding-block:40px 6px}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:16px}
.shead h2{font-size:clamp(1.8rem,4.6vw,2.6rem);font-style:italic}
.shead .no{font-family:var(--f-type);color:var(--gold);font-size:.9rem}
.shead > span:last-child{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--gold)}
.lede{max-width:68ch}
.pad{padding:20px clamp(16px,3vw,28px)}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--paper);border:1.5px solid currentColor;padding:1px 7px;white-space:nowrap}
.chip i{font-style:normal;font-weight:500;text-transform:none;letter-spacing:.02em}
.cite{font-family:var(--f-type);font-size:.74rem;color:var(--ink-soft)}
.meta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:4px}
.optag{font-family:var(--f-ui);font-size:.64rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--paper);background:var(--blood);padding:2px 7px;vertical-align:middle}

/* rules + bottom line */
.rules{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.rule{padding:16px 18px;border-left:5px solid var(--blood);position:relative}
.rule b{font-family:var(--f-display);font-style:italic;font-size:1.2rem;display:block;line-height:1.2;margin-bottom:6px;padding-right:22px}
.rule .n{position:absolute;top:10px;right:14px;font-family:var(--f-type);color:var(--blood)}
.bottom{padding:24px clamp(18px,4vw,36px);border-top:6px solid var(--blood);margin-top:18px}
.bottom p{font-size:clamp(1.08rem,2.4vw,1.28rem);line-height:1.55;margin:10px 0 0;max-width:62ch}
.bottom p b{background:linear-gradient(transparent 62%,rgba(176,42,34,.18) 0)}

/* timeline */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.filters button{font-family:var(--f-ui);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;border:1px solid var(--rule);background:rgba(0,0,0,.35);color:var(--bone);padding:6px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 18px;padding:12px 0;border-bottom:1px dotted var(--line)}
.tl li:last-child{border-bottom:0}
@media (max-width:620px){.tl li{grid-template-columns:1fr}}
.tl .when{font-family:var(--f-type);font-size:.86rem;color:var(--ink)}
.tl .type{display:block;font-family:var(--f-ui);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--blood);margin-top:2px}
.tl .what{min-width:0}
.tl .conf{display:block;font-family:var(--f-ui);font-size:.82rem;font-weight:600;color:var(--blood);margin-top:2px}

/* money */
.money-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
@media (max-width:860px){.money-grid{grid-template-columns:1fr}}
.chart-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.chart-head h3{font-size:1.3rem;font-style:italic}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--f-ui);font-size:.82rem;margin:8px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .lbl{font-family:var(--f-ui);font-size:13px;fill:var(--ink)}
.chart .val{font-family:var(--f-type);font-size:12px;fill:var(--ink)}
.chart .tick{font-family:var(--f-type);font-size:11px;fill:var(--ink-soft)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:.82rem;padding:6px 9px;max-width:240px;transform:translate(-50%,-110%);box-shadow:0 8px 20px -8px #000;z-index:5}
.linkbtn{background:none;border:0;padding:0;font-family:var(--f-ui);font-size:.82rem;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--ink)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.1em;font-size:.72rem;font-weight:600}
td.num{font-family:var(--f-type);font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.donts{list-style:none;margin:0;padding:0}
.donts li{padding:9px 0;border-bottom:1px dotted var(--line);font-size:.93rem}
.donts b{color:var(--blood)}

/* players */
.players{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.player{padding:18px 20px;border-top:5px solid var(--ink);display:flex;flex-direction:column;gap:8px}
.player .role{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.12em;font-size:.7rem;color:var(--ink-soft)}
.player h3{font-size:1.6rem;font-style:italic}
.call{border-left:4px solid var(--blood);padding:6px 0 6px 12px;margin:4px 0;font-size:1.04rem}
.call .optag{margin-right:6px}
.conf{display:inline-block;font-family:var(--f-type);font-size:.76rem;color:var(--blood);border:1px solid var(--blood);padding:0 6px}
.showed{margin:0;padding-left:18px;font-size:.92rem}
.showed li{margin-bottom:6px}
details{border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
summary{cursor:pointer;font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.12em;font-size:.74rem}
details ul{margin:8px 0 0;padding-left:18px;font-size:.88rem}
details li{margin-bottom:6px}
.change{font-size:.88rem;margin:0}

/* storylines */
.stories{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.story{padding:20px 22px;border-top:6px solid var(--ink);position:relative;display:flex;flex-direction:column;gap:8px}
.story.likely{border-top-color:var(--ink)} .story.interesting{border-top-color:var(--gold-dim)} .story.wild{border-top-color:var(--blood)}
.story .label{font-family:var(--f-ui);text-transform:uppercase;letter-spacing:.18em;font-size:.7rem;color:var(--blood)}
.story h3{font-size:1.65rem;font-style:italic}
.logline{font-family:var(--f-type);font-size:.94rem;margin:0}
.odds{display:flex;align-items:center;gap:10px;font-family:var(--f-ui);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.odds b{font-family:var(--f-display);font-size:1.8rem;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.beats{margin:0;padding-left:20px;font-size:.92rem}
.beats li{margin-bottom:6px}
.dots{font-size:.88rem;margin:0}
.kills{font-size:.88rem;margin:0;border-top:1px dotted var(--line);padding-top:8px;margin-top:auto}

/* outcomes */
.outcomes{list-style:none;margin:0;padding:0}
.outcomes li{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:6px 22px;padding:14px 0;border-bottom:1px dotted var(--line);align-items:start}
@media (max-width:700px){.outcomes li{grid-template-columns:1fr}}
.outcomes h4{margin:0;font-family:var(--f-body);font-weight:600;font-size:1.02rem}
.outcomes p{margin:4px 0 0;font-size:.9rem}
.meter{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.meter b{font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:3.2ch}
.bar{height:10px;background:var(--paper-2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c-odds);border-radius:0 4px 4px 0}
.meter small{grid-column:1 / -1;font-family:var(--f-ui);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}

/* takeaways */
.takeaways{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.take{padding:18px 20px 16px;position:relative}
.take .n{position:absolute;top:10px;right:14px;font-family:var(--f-display);font-style:italic;font-size:2rem;line-height:1;color:var(--blood)}
.take h3{font-size:1.25rem;font-style:italic;padding-right:34px;margin-bottom:6px}
.take p{margin:0 0 8px;font-size:.94rem}
.take .dry{font-family:var(--f-type);font-size:.86rem;border-left:2px solid var(--blood-hi);padding-left:10px;color:var(--ink-soft)}

/* documents */
.docs{display:grid;gap:16px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:860px){.docs{grid-template-columns:1fr}}
.doc{padding:10px 0;border-bottom:1px dotted var(--line)}
.doc h4{margin:0;font-family:var(--f-body);font-weight:600;font-size:.96rem}
.doc p{margin:4px 0;font-size:.88rem}
.links{display:flex;flex-wrap:wrap;gap:4px 12px}
.links a{font-family:var(--f-ui);font-size:.82rem}

footer{margin-top:50px;border-top:1px solid var(--rule);padding-block:22px;font-size:.84rem;color:var(--bone-dim);background:#050605}
footer a{color:var(--bone)}
</style>

          <p className="sub">The record, the timeline, the money, and our call. No fiction. Every fact is labeled and linked; every judgment says it's ours.</p>

          <span className="optag">Our call · opinion, not a finding</span>

          <p>By 2022–2023 at the latest, <b>the people running the Fund knew it was in serious trouble</b>, and the Fund kept selling anyway. The record says it plainly: they borrowed from their own investors, sold shares at a discount while calling it a last chance, and had $218,000 in the bank.</p>
